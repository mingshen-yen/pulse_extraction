# Cloudflare Pages project for the showcase site.
#
#   site/        static assets (Leaflet map, Chart.js, data/*.json)
#   functions/   Pages Functions -> /api/*, served from the D1 database below
#   db/          D1 schema; db/seed.sql is generated by scripts/build_d1_seed.py
#
# site/data/*.json stays the build output of the pipeline and the reference
# catalogs; D1 is loaded from it, and the front end falls back to it when the
# API is unavailable (e.g. `python -m http.server -d site`).

name = "pulse-extraction"
pages_build_output_dir = "site"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pulse_db"
database_id = "77b673d8-0d51-420f-abb0-23f82b2d5675"
