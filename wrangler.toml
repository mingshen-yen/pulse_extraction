# Cloudflare Pages project for the showcase site.
#
#   web/         the page (Vite + React); `npm run build` -> web/dist
#   functions/   Pages Functions: /api/* over the D1 database below, and the
#                middleware that keeps mingslab.com/pulse_database the one URL
#   db/          schema.sql (idempotent); D1 itself is the source of truth

name = "pulse-extraction"
pages_build_output_dir = "web/dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pulse_api"
database_id = "348e185f-a6da-4627-afd1-61c2936a0f5a"
