# Cloudflare Pages + D1 config for the showcase site.
#
#   site/            static assets (Leaflet map, Chart.js, data/) -> Pages
#   functions/       Pages Functions -> /api/* , query D1
#   db/              schema + migrations + xlsx-derived seed
#
# The pulse pipeline (scripts/build_site_data.py, needs obspy/scipy) stays a
# local / CI batch job and writes site/data/events/*.json.  Only the published
# reference catalogs are served from D1.

name = "pulse-extraction"
pages_build_output_dir = "site"
compatibility_date = "2024-09-01"

# `wrangler d1 create pulse_db` prints the database_id -- paste it here.
[[d1_databases]]
binding = "DB"
database_name = "pulse_db"
database_id = "77b673d8-0d51-420f-abb0-23f82b2d5675"
migrations_dir = "db/migrations"
