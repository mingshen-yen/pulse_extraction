name: Refresh event data

on:
  schedule:
    - cron: "17 */6 * * *"          # every 6 h
  workflow_dispatch:
    inputs:
      mode:
        description: "poll (new live events) or curated (rebuild all)"
        default: poll
        type: choice
        options: [poll, curated]
      min_mag:
        description: "poll: minimum magnitude"
        default: "5.8"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build
        run: |
          if [ "${{ inputs.mode }}" = "curated" ]; then
            python scripts/build_site_data.py --curated
          else
            python scripts/build_site_data.py --poll --min-mag "${{ inputs.min_mag || '5.8' }}" --hours 168
          fi
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- site/data; then
            git add site/data
            git commit -m "data: refresh event JSON ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "no data changes"
          fi
